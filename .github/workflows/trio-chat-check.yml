name: Trio Chat checks
on:
  push:
    paths:
      - "dashboard/trio-chat.html"
      - "dashboard/api/**"
      - "dashboard/vercel.json"
      - "dashboard/trio-chat-tests.js"
      - ".github/workflows/trio-chat-check.yml"
  pull_request:
    paths:
      - "dashboard/trio-chat.html"
      - "dashboard/api/**"
      - "dashboard/vercel.json"
      - "dashboard/trio-chat-tests.js"
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - run: node dashboard/trio-chat-tests.js
